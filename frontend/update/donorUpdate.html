<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manara-Nexus - Edit Profile</title>
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../bootstrap/css/style.css">
</head>
<body class="text-center">
    <div id="alertBox" class="alert" style="display:none;"></div>
    <form class="form-signin" id="updateForm">
        <img class="mb-4" src="../../images/index/logo.png" alt="Logo" width="72" height="72">
        <h3 class="h3 mb-3 font-weight-normal">Edit Donor Profile</h3>
        <p>Name: <input type="text" id="name"></p>
        <p>Phone: <input type="text" id="phone"></p>
        <p>Address: <input type="text" id="address"></p>
        <p>Bank Name: <input type="text" id="bank_name"></p>
        <p>IFSC Code: <input type="text" id="ifsc_code"></p>
        <p>Account Number: <input type="text" id="account_number"></p>
        <p>City:
            <select id="city">
                <option value="Bengaluru">Bengaluru</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Chennai">Chennai</option>
                <option value="Mumbai">Mumbai</option>
            </select>
        </p>
        <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
        <a href="../dashboard/donorDashboard.html" class="btn btn-secondary btn-lg">Cancel</a>
    </form>
<script src="../../bootstrap/js/jquery.min.js"></script>
<script src="../../bootstrap/js/bootstrap.min.js"></script>
<script src="../../assets/js/api.js"></script>
<script>
    if (!requireAuth('donor')) throw new Error('Unauthorized');

    async function loadProfile() {
        try {
            const res = await api('GET', '/profile');
            const d   = res.data;
            document.getElementById('name').value           = d.name  || '';
            document.getElementById('phone').value          = d.phone || '';
            document.getElementById('city').value           = d.city  || 'Bengaluru';
            document.getElementById('address').value        = d.profile?.address        || '';
            document.getElementById('bank_name').value      = d.profile?.bank_name      || '';
            document.getElementById('ifsc_code').value      = d.profile?.ifsc_code      || '';
            document.getElementById('account_number').value = d.profile?.account_number || '';
        } catch (err) { showAlert('error', err.message); }
    }

    document.getElementById('updateForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const body = {
            name          : document.getElementById('name').value.trim(),
            phone         : document.getElementById('phone').value.trim(),
            city          : document.getElementById('city').value,
            address       : document.getElementById('address').value.trim(),
            bank_name     : document.getElementById('bank_name').value.trim(),
            ifsc_code     : document.getElementById('ifsc_code').value.trim(),
            account_number: document.getElementById('account_number').value.trim(),
        };
        try {
            await api('PUT', '/profile', body);
            showAlert('success', 'Profile updated!');
            setTimeout(() => window.location.href = '../dashboard/donorDashboard.html', 1500);
        } catch (err) { showAlert('error', err.message); }
    });

    loadProfile();
</script>
</body>
</html>
