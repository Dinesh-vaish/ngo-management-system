<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manara-Nexus - Edit Volunteer Profile</title>
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../bootstrap/css/style.css">
</head>
<body class="text-center">
    <div id="alertBox" class="alert" style="display:none;"></div>
    <form class="form-signin" id="updateForm">
        <img class="mb-4" src="../../images/index/logo.png" alt="Logo" width="72" height="72">
        <h3 class="h3 mb-3 font-weight-normal">Edit Volunteer Profile</h3>
        <p>Name: <input type="text" id="name"></p>
        <p>Phone: <input type="text" id="phone"></p>
        <p>Interests: <input type="text" id="interests"></p>
        <p>Date of Birth: <input type="date" id="dob"></p>
        <p>City:
            <select id="city">
                <option value="Bengaluru">Bengaluru</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Chennai">Chennai</option>
                <option value="Mumbai">Mumbai</option>
            </select>
        </p>
        <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
        <a href="../dashboard/volunteerDashboard.html" class="btn btn-secondary btn-lg">Cancel</a>
    </form>
<script src="../../bootstrap/js/jquery.min.js"></script>
<script src="../../bootstrap/js/bootstrap.min.js"></script>
<script src="../../assets/js/api.js"></script>
<script>
    if (!requireAuth('volunteer')) throw new Error('Unauthorized');

    async function loadProfile() {
        try {
            const res = await api('GET', '/profile');
            const d   = res.data;
            document.getElementById('name').value      = d.name  || '';
            document.getElementById('phone').value     = d.phone || '';
            document.getElementById('city').value      = d.city  || 'Bengaluru';
            document.getElementById('interests').value = d.profile?.interests || '';
            if (d.profile?.dob)
                document.getElementById('dob').value   = new Date(d.profile.dob).toISOString().slice(0,10);
        } catch (err) { showAlert('error', err.message); }
    }

    document.getElementById('updateForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const body = {
            name     : document.getElementById('name').value.trim(),
            phone    : document.getElementById('phone').value.trim(),
            city     : document.getElementById('city').value,
            interests: document.getElementById('interests').value.trim(),
            dob      : document.getElementById('dob').value,
        };
        try {
            await api('PUT', '/profile', body);
            showAlert('success', 'Profile updated!');
            setTimeout(() => window.location.href = '../dashboard/volunteerDashboard.html', 1500);
        } catch (err) { showAlert('error', err.message); }
    });

    loadProfile();
</script>
</body>
</html>
