<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manara-Nexus - Donor Signup</title>
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../bootstrap/css/style.css">
</head>
<body class="text-center">
    <div id="alertBox" class="alert" style="display:none;"></div>
    <form class="form-signin" id="donorSignupForm">
        <img class="mb-4" src="../../images/index/logo.png" alt="Logo" width="72" height="72">
        <h3 class="h3 mb-3 font-weight-normal">Donor Signup</h3>
        <p>Name: <input type="text" id="name" required></p>
        <p>Email: <input type="email" id="email" required></p>
        <p>Password: <input type="password" id="password" required></p>
        <p>Phone: <input type="text" id="phone" required></p>
        <p>Address: <input type="text" id="address"></p>
        <p>City:
            <select id="city">
                <option value="Bengaluru">Bengaluru</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Chennai">Chennai</option>
                <option value="Mumbai">Mumbai</option>
            </select>
        </p>
        <button type="submit" class="btn btn-lg btn-primary">Register</button>
        <button type="button" class="btn btn-lg btn-secondary" onclick="window.location.href='../login/donorLogin.html'">Cancel</button>
    </form>
<script src="../../bootstrap/js/jquery.min.js"></script>
<script src="../../bootstrap/js/bootstrap.min.js"></script>
<script src="../../assets/js/api.js"></script>
<script>
    document.getElementById('donorSignupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const body = {
            name    : document.getElementById('name').value.trim(),
            email   : document.getElementById('email').value.trim(),
            password: document.getElementById('password').value.trim(),
            phone   : document.getElementById('phone').value.trim(),
            address : document.getElementById('address').value.trim(),
            city    : document.getElementById('city').value,
        };
        if (!body.name || !body.email || !body.password || !body.phone)
            return showAlert('error', 'All fields are required.');
        try {
            const res = await api('POST', '/auth/register/donor', body);
            setToken(res.token); setUser(res.user);
            redirectToDashboard('donor');
        } catch (err) { showAlert('error', err.message || 'Registration failed.'); }
    });
</script>
</body>
</html>
